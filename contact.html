<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h1>お問い合わせフォーム</h1>
        <nav>
           <ul>
              <li><a href="work.html">ホーム</a></li>
              <li><a href="contact.html">お問い合わせ</a></li>
              <li><a href="work_list.html">課題一覧</a></li>
           </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>お問い合わせはこちら</h2>

            <form action="#" method="POST">

                <label for="name">名前：</label>
                <input type="text" id="name" name="name" required>

                <label for="email">メールアドレス：</label>
                <input type="email" id="email" name="email" required>

                <label for="choice">目的：</label>
                <select name="choice" id="choice">
                    <option value="not_choice">未選択</option>
                    <option value="recruitment">リクルート</option>
                    <option value="question">質問</option>
                    <option value="job_request">仕事依頼</option>
                </select>

                <label for="message">メッセージ：</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="submit-btn">送信</button>

            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 私のポートフォリオ</p>
    </footer>
</body>
</html>
