<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー検索</title>
    <!-- style.css を読み込む -->
    <link rel="stylesheet" href="start-folder/css/style.css">
</head>
<body>

    <header>
        <h1>GitHub検索</h1>
        <nav>
            <ul>
                <li><a href="work.html">ホーム</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
                <li><a href="work_list.html">課題一覧</a></li>
                <li><a href="calc.html">電卓</a></li>
                <li><a href="githubsearch.html">GitHub検索</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- 既存のピンク背景セクションを使用 -->
        <section>
            <h2>GitHubユーザー情報を取得しよう</h2>
            
            <!-- 幅を最大300pxに制限して、中央寄せに配置 -->
            <div style="max-width: 300px; margin: 0 auto 30px; display: flex; flex-direction: column; gap: 15px; text-align: left;">
                <label for="username" style="text-align: center; display: block;">GitHubユーザー名：</label>
                
                <!--background-color: #ffffff; を追加して、入力欄を白く-->
                <input type="text" id="username" placeholder="ユーザー名を入力" style="width: 100%; max-width: 300px; background-color: #ffffff; display: block; margin: 0 auto; box-sizing: border-box;">
                
                <button id="searchBtn" class="submit-btn" style="width: 100%;">検索</button>
            </div>
            
            <!-- 検索結果を表示 -->
            <div id="result" style="margin-top: 20px; background: transparent; padding: 10px; text-align: left; color: #4c407f;">
                <p style="margin: 0; text-align: center;">ユーザー名を入力して検索してください。</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 私のポートフォリオ</p>
    </footer>

    <!-- JavaScriptファイルへのパス -->
    <script src="start-folder/JavaScriptWork/githubsearch.js"></script>
</body>
</html>
